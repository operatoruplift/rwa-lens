name: Explicit hosted read verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-public-mainnet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Read public app (no wallet or provider secrets)
        run: node scripts/verify-live.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: hosted-read-evidence
          path: docs/evidence/live-observations.json
          retention-days: 14
